name: Bug report
description: plugbricks did something wrong, refused something it should accept, or failed with an error.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. For a vulnerability, do not use this form: see SECURITY.md.
        **Never paste the content of `.secrets/`, a password or a token**: describe them instead.
  - type: input
    id: version
    attributes:
      label: plugbricks version
      description: The output of `npx plugbricks --version`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Docker Compose
        - Kubernetes
        - Not a runtime command (init, add, remove, status, create, admin, ...)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: The operating system, `node --version`, and for a runtime command `docker compose version` or the Kubernetes distribution.
      placeholder: Ubuntu 24.04, Node 22.23.5, Docker Compose v2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you ran
      description: The commands, in order, from a new or an existing project.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What plugbricks printed
      description: The whole output. A refusal starts with `error SOME_CODE:`, and the code is what tells the cases apart.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: platform.json and the manifests involved
      description: Optional. Useful when the problem depends on the bricks; leave out anything private.
      render: json
