name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions pinned by commit SHA; the comment gives the release it was resolved from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Windows runners check out with core.autocrlf=true: .gitattributes must still give LF.
      - name: Check that the working tree has LF line endings
        shell: bash
        run: |
          crlf=$(git ls-files --eol | grep 'w/crlf' || true)
          if [ -n "$crlf" ]; then echo "Files checked out with CRLF:"; echo "$crlf"; exit 1; fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Exact Node 22 version, shared with local development; matches the dev container image.
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apis/orders/package-lock.json
            apis/shipping/package-lock.json
            apis/queue-consumer/package-lock.json

      - run: node --version

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Example APIs: standalone packages with their own lockfile (not npm workspaces), so that a
      # brick folder never contains node_modules. Their database tests need a Linux Docker engine
      # and are skipped elsewhere, with the reason in the test title.
      - name: Example API orders
        working-directory: apis/orders
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Example API shipping
        working-directory: apis/shipping
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Example API queue-consumer
        working-directory: apis/queue-consumer
        run: |
          npm ci
          npm run typecheck
          npm test

  # The Kubernetes driver on a real cluster: a throwaway k3d cluster named pbtest-ci-*, driven only
  # through an explicit kubeconfig file and context (the test refuses any context that does not
  # start with "k3d-pbtest-"). Tools and the k3s image come from tools.json: every download is
  # checked against its sha256 before it is installed, and the k3s image is pinned by digest.
  k8s:
    name: kubernetes (k3d)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLUSTER: pbtest-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apis/orders/package-lock.json
            apis/shipping/package-lock.json
            apis/queue-consumer/package-lock.json

      - run: npm ci

      # k3s opens many inotify instances; with the default limit the control plane can fail to start
      # ("too many open files"), as it did on a developer machine running other containers.
      - name: Raise the inotify instance limit
        run: sudo sysctl -w fs.inotify.max_user_instances=512

      - name: Install k3d and kubectl (sha256 from tools.json, checked before install)
        run: |
          node scripts/install-tool.mjs k3d "$RUNNER_TEMP/bin"
          node scripts/install-tool.mjs kubectl "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Create the throwaway cluster
        run: |
          image=$(node -p 'require("./tools.json").images.k3s.reference')
          k3d cluster create "$CLUSTER" --image "$image" --no-lb --wait --timeout 240s \
            --kubeconfig-update-default=false --kubeconfig-switch-context=false
          k3d kubeconfig write "$CLUSTER" --output "$RUNNER_TEMP/kubeconfig.yaml"
          echo "PLUGBRICKS_K8S_CONTEXT=k3d-$CLUSTER" >> "$GITHUB_ENV"
          echo "PLUGBRICKS_K8S_KUBECONFIG=$RUNNER_TEMP/kubeconfig.yaml" >> "$GITHUB_ENV"

      - name: Kubernetes end-to-end test
        run: npm test -w plugbricks -- e2e-k8s

      - name: Cluster state after a failure
        if: failure()
        run: |
          kubectl --kubeconfig "$PLUGBRICKS_K8S_KUBECONFIG" --context "$PLUGBRICKS_K8S_CONTEXT" get pods --all-namespaces --output wide || true
          kubectl --kubeconfig "$PLUGBRICKS_K8S_KUBECONFIG" --context "$PLUGBRICKS_K8S_CONTEXT" get events --all-namespaces --sort-by=.lastTimestamp || true

      - name: Delete the throwaway cluster
        if: always()
        run: k3d cluster delete "$CLUSTER"

  # Code quality, on Linux only (the 3-OS matrix above runs the tests everywhere).
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apis/orders/package-lock.json
            apis/shipping/package-lock.json
            apis/queue-consumer/package-lock.json
            tools/wgc-crosscheck/package-lock.json

      - run: npm ci

      # The official Cosmo CLI, pinned in tools/wgc-crosscheck (a standalone package, never a dependency of
      # plugbricks): without it the cross-check of our router configuration is skipped, with the reason in its title.
      - name: Install wgc for the router cross-check
        run: npm run crosscheck:install

      # Prettier, ESLint, typecheck and the tests: the same command as on a developer machine.
      - run: npm run quality

      # Known vulnerabilities in what ships (dev dependencies are not audited here: the test runner
      # has open advisories whose fix is a major upgrade, tracked separately).
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Coverage of the unit tests (v8), reported only: there is no threshold.
      - name: Coverage report
        run: |
          npm run coverage -w plugbricks | tee "$RUNNER_TEMP/coverage.txt"
          {
            echo '### Coverage of the unit tests (no threshold)'
            echo '```'
            sed -n '/Coverage summary/,/=====$/p' "$RUNNER_TEMP/coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
