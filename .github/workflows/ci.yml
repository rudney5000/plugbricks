name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions pinned by commit SHA; the comment gives the release it was resolved from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Windows runners check out with core.autocrlf=true: .gitattributes must still give LF.
      - name: Check that the working tree has LF line endings
        shell: bash
        run: |
          crlf=$(git ls-files --eol | grep 'w/crlf' || true)
          if [ -n "$crlf" ]; then echo "Files checked out with CRLF:"; echo "$crlf"; exit 1; fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Exact Node 22 version, shared with local development; matches the dev container image.
          node-version-file: .node-version
          cache: npm

      - run: node --version

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
