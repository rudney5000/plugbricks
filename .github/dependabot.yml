# Weekly update pull requests, grouped so that one week gives few of them.
# Versions are pinned exactly in package.json and by SHA in the workflows; Dependabot keeps both current.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
    # The composer (@wundergraph/composition, cosmo-shared) asks for graphql ^16.9 and @graphql-tools/utils ^12.1:
    # a new major of either cannot be taken until it does (D8). Patches and minors still come.
    ignore:
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@graphql-tools/utils"
        update-types: ["version-update:semver-major"]

  # apis/orders-api is a standalone package with its own lock file (not an npm workspace).
  - package-ecosystem: npm
    directory: /apis/orders-api
    schedule:
      interval: weekly
    groups:
      orders-api-dependencies:
        patterns: ["*"]

  # Same for apis/shipping-api: it is kept on the same versions as apis/orders-api, so merge both together.
  - package-ecosystem: npm
    directory: /apis/shipping-api
    schedule:
      interval: weekly
    groups:
      shipping-api-dependencies:
        patterns: ["*"]

  # Same for apis/queue-consumer: a standalone package with its own lock file.
  - package-ecosystem: npm
    directory: /apis/queue-consumer
    schedule:
      interval: weekly
    groups:
      queue-consumer-dependencies:
        patterns: ["*"]

  # tools/wgc-crosscheck holds only the official Cosmo CLI for a test; a new version is a new reference to compare with.
  - package-ecosystem: npm
    directory: /tools/wgc-crosscheck
    schedule:
      interval: weekly
    groups:
      wgc-crosscheck:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
