# Generated by plugbricks from platform.lock and .platform/bricks/. Do not edit: run "plugbricks generate".
name: queue-demo
services:
  consumer-app:
    image: redis:7.4.1-alpine
    environment:
      NATS_URL: nats://nats-broker:4222
      SUBJECT: consumer
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: "5s"
      timeout: "3s"
      retries: 10
      start_period: "0s"
    depends_on:
      consumer-provision-queue:
        condition: service_completed_successfully
    restart: unless-stopped
  consumer-provision-queue:
    image: busybox:1.36
    entrypoint:
      - "true"
    depends_on:
      consumer-wait-queue:
        condition: service_completed_successfully
    restart: "no"
  consumer-wait-queue:
    image: busybox:1.36
    entrypoint:
      - /bin/sh
      - "-c"
      - "deadline=$$(( $$(date +%s) + PB_WAIT_TIMEOUT ))\nuntil \"$$@\" >/dev/null 2>&1; do\n  if [ \"$$(date +%s)\" -ge \"$$deadline\" ]; then\n    echo \"plugbricks: WAIT_TIMEOUT: gave up waiting for $$PB_WAIT_FOR after $${PB_WAIT_TIMEOUT}s\" >&2\n    exit 124\n  fi\n  sleep \"$$PB_WAIT_INTERVAL\"\ndone\necho \"plugbricks: $$PB_WAIT_FOR is ready\""
      - plugbricks-wait
    command:
      - nc
      - "-z"
      - "-w"
      - "2"
      - nats-broker
      - "4222"
    environment:
      PB_WAIT_FOR: "queue from nats-broker (for consumer)"
      PB_WAIT_INTERVAL: "2"
      PB_WAIT_TIMEOUT: "60"
    depends_on:
      nats-broker:
        condition: service_started
    restart: "no"
  nats-broker:
    image: nats:2.11.6-alpine
    restart: unless-stopped
