apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-app
  namespace: demo
  labels:
    app.kubernetes.io/managed-by: plugbricks
    app.kubernetes.io/part-of: demo
    plugbricks/brick: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      plugbricks/service: keycloak-app
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: plugbricks
        app.kubernetes.io/part-of: demo
        plugbricks/brick: keycloak
        plugbricks/service: keycloak-app
    spec:
      initContainers:
        - name: wait-database
          image: postgres:16.4-alpine
          command:
            - /bin/sh
            - "-c"
            - "deadline=$$(( $$(date +%s) + PB_WAIT_TIMEOUT ))\nuntil \"$$@\" >/dev/null 2>&1; do\n  if [ \"$$(date +%s)\" -ge \"$$deadline\" ]; then\n    echo \"plugbricks: WAIT_TIMEOUT: gave up waiting for $$PB_WAIT_FOR after $${PB_WAIT_TIMEOUT}s\" >&2\n    exit 124\n  fi\n  sleep \"$$PB_WAIT_INTERVAL\"\ndone\necho \"plugbricks: $$PB_WAIT_FOR is ready\""
            - plugbricks-wait
          args:
            - pg_isready
            - "-q"
            - "-h"
            - postgres-db
            - "-p"
            - "5432"
            - "-t"
            - "2"
          env:
            - name: PB_WAIT_FOR
              value: "database from postgres-db (for keycloak)"
            - name: PB_WAIT_INTERVAL
              value: "2"
            - name: PB_WAIT_TIMEOUT
              value: "120"
        - name: provision-database
          image: postgres:16.4-alpine
          command:
            - /bin/sh
            - /provision/create-database.sh
          env:
            - name: PB_POSTGRES__KEYCLOAK__CONSUMER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_POSTGRES__KEYCLOAK__CONSUMER_PASSWORD
            - name: PB_POSTGRES__SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_POSTGRES__SUPERUSER_PASSWORD
            - name: APP_DATABASE
              value: keycloak
            - name: APP_PASSWORD
              value: "$(PB_POSTGRES__KEYCLOAK__CONSUMER_PASSWORD)"
            - name: APP_ROLE
              value: keycloak
            - name: PGHOST
              value: postgres-db
            - name: PGPASSWORD
              value: "$(PB_POSTGRES__SUPERUSER_PASSWORD)"
            - name: PGPORT
              value: "5432"
          volumeMounts:
            - name: scripts-database
              mountPath: /provision
              readOnly: true
      containers:
        - name: app
          image: ghcr.io/rudney5000/plugbricks/keycloak:0.1.0
          ports:
            - containerPort: 8080
          env:
            - name: PB_KEYCLOAK__ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_KEYCLOAK__ADMIN_PASSWORD
            - name: PB_POSTGRES__KEYCLOAK__CONSUMER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_POSTGRES__KEYCLOAK__CONSUMER_PASSWORD
            - name: DATABASE_URL
              value: "postgres://keycloak:$(PB_POSTGRES__KEYCLOAK__CONSUMER_PASSWORD)@postgres-db:5432/keycloak"
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: "$(PB_KEYCLOAK__ADMIN_PASSWORD)"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_HOSTNAME
              value: http://127.0.0.1:8080
            - name: KC_HTTP_ENABLED
              value: "true"
          readinessProbe:
            exec:
              command:
                - bash
                - "-c"
                - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/plugbricks/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          startupProbe:
            exec:
              command:
                - bash
                - "-c"
                - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/plugbricks/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 28
      volumes:
        - name: scripts-database
          configMap:
            name: postgres-database-scripts
            defaultMode: 365
            items:
              - key: create-database.sh
                path: create-database.sh
---
