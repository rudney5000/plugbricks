# Generated by plugbricks from platform.lock and .platform/bricks/. Do not edit: run "plugbricks generate".
name: demo
services:
  app-opt-provision-database:
    image: postgres:16.4-alpine
    entrypoint:
      - /bin/sh
      - /provision/create-database.sh
    environment:
      APP_DATABASE: app-opt
      APP_PASSWORD: "${PB_POSTGRES__APP_OPT__CONSUMER_PASSWORD:?missing secret; run plugbricks generate}"
      APP_ROLE: app-opt
      PGHOST: postgres-db
      PGPASSWORD: "${PB_POSTGRES__SUPERUSER_PASSWORD:?missing secret; run plugbricks generate}"
      PGPORT: "5432"
    volumes:
      - type: bind
        source: "../../.platform/bricks/postgres/provision"
        target: /provision
        read_only: true
    depends_on:
      app-opt-wait-database:
        condition: service_completed_successfully
    restart: "no"
  app-opt-wait-database:
    image: postgres:16.4-alpine
    entrypoint:
      - /bin/sh
      - "-c"
      - "deadline=$$(( $$(date +%s) + PB_WAIT_TIMEOUT ))\nuntil \"$$@\" >/dev/null 2>&1; do\n  if [ \"$$(date +%s)\" -ge \"$$deadline\" ]; then\n    echo \"plugbricks: WAIT_TIMEOUT: gave up waiting for $$PB_WAIT_FOR after $${PB_WAIT_TIMEOUT}s\" >&2\n    exit 124\n  fi\n  sleep \"$$PB_WAIT_INTERVAL\"\ndone\necho \"plugbricks: $$PB_WAIT_FOR is ready\""
      - plugbricks-wait
    command:
      - pg_isready
      - "-q"
      - "-h"
      - postgres-db
      - "-p"
      - "5432"
      - "-t"
      - "2"
    environment:
      PB_WAIT_FOR: "database from postgres-db (for app-opt)"
      PB_WAIT_INTERVAL: "2"
      PB_WAIT_TIMEOUT: "120"
    depends_on:
      postgres-db:
        condition: service_started
    restart: "no"
  app-opt-web:
    image: nginx:1.27.3-alpine
    environment:
      DATABASE_URL: "postgres://app-opt:${PB_POSTGRES__APP_OPT__CONSUMER_PASSWORD:?missing secret; run plugbricks generate}@postgres-db:5432/app-opt"
    depends_on:
      app-opt-provision-database:
        condition: service_completed_successfully
    restart: unless-stopped
  postgres-db:
    image: postgres:16.4-alpine
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: "${PB_POSTGRES__SUPERUSER_PASSWORD:?missing secret; run plugbricks generate}"
    healthcheck:
      test:
        - CMD
        - pg_isready
        - "-U"
        - postgres
      interval: "5s"
      timeout: "3s"
      retries: 10
      start_period: "0s"
    volumes:
      - type: volume
        source: postgres-db-data
        target: /var/lib/postgresql/data
    restart: unless-stopped
volumes:
  postgres-db-data:
    name: demo_postgres-db-data
