# Generated by plugbricks from platform.lock and .platform/bricks/. Do not edit: run "plugbricks generate".
name: demo
services:
  postgres-db:
    image: postgres:16.4-alpine
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: "${PB_POSTGRES__SUPERUSER_PASSWORD:?missing secret; run plugbricks generate}"
    healthcheck:
      test:
        - CMD
        - pg_isready
        - "-U"
        - postgres
      interval: "5s"
      timeout: "3s"
      retries: 10
      start_period: "0s"
    volumes:
      - type: volume
        source: postgres-db-data
        target: /var/lib/postgresql/data
    restart: unless-stopped
volumes:
  postgres-db-data:
    name: demo_postgres-db-data
