apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-app
  namespace: queue-demo
  labels:
    app.kubernetes.io/managed-by: plugbricks
    app.kubernetes.io/part-of: queue-demo
    plugbricks/brick: consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      plugbricks/service: consumer-app
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: plugbricks
        app.kubernetes.io/part-of: queue-demo
        plugbricks/brick: consumer
        plugbricks/service: consumer-app
    spec:
      initContainers:
        - name: wait-queue
          image: busybox:1.36
          command:
            - /bin/sh
            - "-c"
            - "deadline=$$(( $$(date +%s) + PB_WAIT_TIMEOUT ))\nuntil \"$$@\" >/dev/null 2>&1; do\n  if [ \"$$(date +%s)\" -ge \"$$deadline\" ]; then\n    echo \"plugbricks: WAIT_TIMEOUT: gave up waiting for $$PB_WAIT_FOR after $${PB_WAIT_TIMEOUT}s\" >&2\n    exit 124\n  fi\n  sleep \"$$PB_WAIT_INTERVAL\"\ndone\necho \"plugbricks: $$PB_WAIT_FOR is ready\""
            - plugbricks-wait
          args:
            - nc
            - "-z"
            - "-w"
            - "2"
            - rabbitmq-broker
            - "5672"
          env:
            - name: PB_WAIT_FOR
              value: "queue from rabbitmq-broker (for consumer)"
            - name: PB_WAIT_INTERVAL
              value: "2"
            - name: PB_WAIT_TIMEOUT
              value: "60"
        - name: provision-queue
          image: curlimages/curl:8.11.1
          command:
            - /bin/sh
            - /provision/create-vhost.sh
          env:
            - name: PB_RABBITMQ__CONSUMER__CONSUMER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_RABBITMQ__CONSUMER__CONSUMER_PASSWORD
            - name: PB_RABBITMQ__DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_RABBITMQ__DEFAULT_PASSWORD
            - name: ADMIN_PASSWORD
              value: "$(PB_RABBITMQ__DEFAULT_PASSWORD)"
            - name: ADMIN_USER
              value: plugbricks
            - name: APP_PASSWORD
              value: "$(PB_RABBITMQ__CONSUMER__CONSUMER_PASSWORD)"
            - name: APP_USER
              value: consumer
            - name: APP_VHOST
              value: consumer
            - name: MANAGEMENT_URL
              value: http://rabbitmq-broker:15672
          volumeMounts:
            - name: scripts-queue
              mountPath: /provision
              readOnly: true
      containers:
        - name: app
          image: redis:7.4.1-alpine
          ports:
            - containerPort: 6379
          env:
            - name: PB_RABBITMQ__CONSUMER__CONSUMER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_RABBITMQ__CONSUMER__CONSUMER_PASSWORD
            - name: AMQP_URL
              value: "amqp://consumer:$(PB_RABBITMQ__CONSUMER__CONSUMER_PASSWORD)@rabbitmq-broker:5672/consumer"
            - name: QUEUE_NAME
              value: consumer
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
      volumes:
        - name: scripts-queue
          configMap:
            name: rabbitmq-queue-scripts
            defaultMode: 365
            items:
              - key: create-vhost.sh
                path: create-vhost.sh
