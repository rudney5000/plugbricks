# Generated by plugbricks from platform.lock and .platform/bricks/. Do not edit: run "plugbricks generate".
name: queue-demo
services:
  consumer-app:
    image: redis:7.4.1-alpine
    environment:
      AMQP_URL: "amqp://consumer:${PB_RABBITMQ__CONSUMER__CONSUMER_PASSWORD:?missing secret; run plugbricks generate}@rabbitmq-broker:5672/consumer"
      QUEUE_NAME: consumer
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: "5s"
      timeout: "3s"
      retries: 10
      start_period: "0s"
    depends_on:
      consumer-provision-queue:
        condition: service_completed_successfully
    restart: unless-stopped
  consumer-provision-queue:
    image: curlimages/curl:8.11.1
    entrypoint:
      - /bin/sh
      - /provision/create-vhost.sh
    environment:
      ADMIN_PASSWORD: "${PB_RABBITMQ__DEFAULT_PASSWORD:?missing secret; run plugbricks generate}"
      ADMIN_USER: plugbricks
      APP_PASSWORD: "${PB_RABBITMQ__CONSUMER__CONSUMER_PASSWORD:?missing secret; run plugbricks generate}"
      APP_USER: consumer
      APP_VHOST: consumer
      MANAGEMENT_URL: http://rabbitmq-broker:15672
    volumes:
      - type: bind
        source: "../../.platform/bricks/rabbitmq/provision"
        target: /provision
        read_only: true
    depends_on:
      consumer-wait-queue:
        condition: service_completed_successfully
    restart: "no"
  consumer-wait-queue:
    image: busybox:1.36
    entrypoint:
      - /bin/sh
      - "-c"
      - "deadline=$$(( $$(date +%s) + PB_WAIT_TIMEOUT ))\nuntil \"$$@\" >/dev/null 2>&1; do\n  if [ \"$$(date +%s)\" -ge \"$$deadline\" ]; then\n    echo \"plugbricks: WAIT_TIMEOUT: gave up waiting for $$PB_WAIT_FOR after $${PB_WAIT_TIMEOUT}s\" >&2\n    exit 124\n  fi\n  sleep \"$$PB_WAIT_INTERVAL\"\ndone\necho \"plugbricks: $$PB_WAIT_FOR is ready\""
      - plugbricks-wait
    command:
      - nc
      - "-z"
      - "-w"
      - "2"
      - rabbitmq-broker
      - "5672"
    environment:
      PB_WAIT_FOR: "queue from rabbitmq-broker (for consumer)"
      PB_WAIT_INTERVAL: "2"
      PB_WAIT_TIMEOUT: "60"
    depends_on:
      rabbitmq-broker:
        condition: service_started
    restart: "no"
  rabbitmq-broker:
    image: rabbitmq:4.1.4-management
    environment:
      RABBITMQ_DEFAULT_PASS: "${PB_RABBITMQ__DEFAULT_PASSWORD:?missing secret; run plugbricks generate}"
      RABBITMQ_DEFAULT_USER: plugbricks
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - "-q"
        - ping
      interval: "10s"
      timeout: "5s"
      retries: 10
      start_period: "20s"
    volumes:
      - type: volume
        source: rabbitmq-broker-data
        target: /var/lib/rabbitmq
    restart: unless-stopped
volumes:
  rabbitmq-broker-data:
    name: queue-demo_rabbitmq-broker-data
