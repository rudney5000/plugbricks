      APP_ROLE: shipping-api
      PGHOST: postgres-db
      PGPASSWORD: "${PB_POSTGRES__SUPERUSER_PASSWORD:?missing secret; run plugbricks generate}"
      PGPORT: "5432"
    volumes:
      - type: bind
        source: "../../.platform/bricks/postgres/provision"
        target: /provision
        read_only: true
    depends_on:
      shipping-api-wait-database:
        condition: service_completed_successfully
    restart: "no"
  shipping-api-wait-database:
    image: postgres:16.4-alpine
    entrypoint:
