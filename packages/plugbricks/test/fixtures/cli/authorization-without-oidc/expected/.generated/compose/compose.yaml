# Generated by plugbricks from platform.lock and .platform/bricks/. Do not edit: run "plugbricks generate".
name: demo
services:
  orders-api-app:
    image: ghcr.io/rudney5000/plugbricks/orders-api:0.1.1
    environment:
      DATABASE_URL: "postgres://orders-api:${PB_POSTGRES__ORDERS_API__CONSUMER_PASSWORD:?missing secret; run plugbricks generate}@postgres-db:5432/orders-api"
    healthcheck:
      test:
        - CMD
        - wget
        - "-qO-"
        - http://localhost:4000/health
      interval: "5s"
      timeout: "3s"
      retries: 10
      start_period: "0s"
    depends_on:
      orders-api-provision-database:
        condition: service_completed_successfully
    restart: unless-stopped
  orders-api-provision-database:
    image: postgres:16.4-alpine
    entrypoint:
      - /bin/sh
      - /provision/create-database.sh
    environment:
      APP_DATABASE: orders-api
      APP_PASSWORD: "${PB_POSTGRES__ORDERS_API__CONSUMER_PASSWORD:?missing secret; run plugbricks generate}"
      APP_ROLE: orders-api
      PGHOST: postgres-db
      PGPASSWORD: "${PB_POSTGRES__SUPERUSER_PASSWORD:?missing secret; run plugbricks generate}"
      PGPORT: "5432"
    volumes:
      - type: bind
        source: "../../.platform/bricks/postgres/provision"
        target: /provision
        read_only: true
    depends_on:
      orders-api-wait-database:
        condition: service_completed_successfully
    restart: "no"
  orders-api-wait-database:
    image: postgres:16.4-alpine
    entrypoint:
      - /bin/sh
      - "-c"
      - "deadline=$$(( $$(date +%s) + PB_WAIT_TIMEOUT ))\nuntil \"$$@\" >/dev/null 2>&1; do\n  if [ \"$$(date +%s)\" -ge \"$$deadline\" ]; then\n    echo \"plugbricks: WAIT_TIMEOUT: gave up waiting for $$PB_WAIT_FOR after $${PB_WAIT_TIMEOUT}s\" >&2\n    exit 124\n  fi\n  sleep \"$$PB_WAIT_INTERVAL\"\ndone\necho \"plugbricks: $$PB_WAIT_FOR is ready\""
      - plugbricks-wait
    command:
      - pg_isready
      - "-q"
      - "-h"
      - postgres-db
      - "-p"
      - "5432"
      - "-t"
      - "2"
    environment:
      PB_WAIT_FOR: "database from postgres-db (for orders-api)"
      PB_WAIT_INTERVAL: "2"
      PB_WAIT_TIMEOUT: "120"
    depends_on:
      postgres-db:
        condition: service_started
    restart: "no"
  postgres-db:
    image: postgres:16.4-alpine
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: "${PB_POSTGRES__SUPERUSER_PASSWORD:?missing secret; run plugbricks generate}"
    healthcheck:
      test:
        - CMD
        - pg_isready
        - "-U"
        - postgres
      interval: "5s"
      timeout: "3s"
      retries: 10
      start_period: "0s"
    volumes:
      - type: volume
        source: postgres-db-data
        target: /var/lib/postgresql/data
    restart: unless-stopped
  router:
    image: ghcr.io/wundergraph/cosmo/router:0.372.0@sha256:bfe6d89a89ab70975bc874dc234600fe5a6ba6d9498485465a31be4c5b9d0205
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    environment:
      CORS_ALLOW_ORIGINS: http://127.0.0.1:4000
      COSMO_TELEMETRY_DISABLED: "true"
      DO_NOT_TRACK: "1"
      EXECUTION_CONFIG_FILE_PATH: /config/router-config.json
      LISTEN_ADDR: "0.0.0.0:3002"
      METRICS_OTLP_ENABLED: "false"
      PLAYGROUND_ENABLED: "false"
      PROMETHEUS_ENABLED: "false"
      TRACING_ENABLED: "false"
    labels:
      plugbricks.router-config-sha256: e9d916f03e0ff0cd0dd6aac9d8a83c86e78cbf92d7e2b23b7406a033ae2307d9
    volumes:
      - type: bind
        source: "./router-config.json"
        target: /config/router-config.json
        read_only: true
    ports:
      - target: 3002
        published: "4000"
        host_ip: "127.0.0.1"
        protocol: tcp
    depends_on:
      orders-api-app:
        condition: service_healthy
      shipping-api-app:
        condition: service_healthy
    restart: unless-stopped
  shipping-api-app:
    image: ghcr.io/rudney5000/plugbricks/shipping-api:0.1.1
    environment:
      DATABASE_URL: "postgres://shipping-api:${PB_POSTGRES__SHIPPING_API__CONSUMER_PASSWORD:?missing secret; run plugbricks generate}@postgres-db:5432/shipping-api"
    healthcheck:
      test:
        - CMD
        - wget
        - "-qO-"
        - http://localhost:4000/health
      interval: "5s"
      timeout: "3s"
      retries: 10
      start_period: "0s"
    depends_on:
      shipping-api-provision-database:
        condition: service_completed_successfully
    restart: unless-stopped
  shipping-api-provision-database:
    image: postgres:16.4-alpine
    entrypoint:
      - /bin/sh
      - /provision/create-database.sh
    environment:
      APP_DATABASE: shipping-api
