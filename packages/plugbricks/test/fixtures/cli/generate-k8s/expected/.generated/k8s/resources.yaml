apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-app
  namespace: demo
  labels:
    app.kubernetes.io/managed-by: plugbricks
    app.kubernetes.io/part-of: demo
    plugbricks/brick: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      plugbricks/service: orders-app
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: plugbricks
        app.kubernetes.io/part-of: demo
        plugbricks/brick: orders
        plugbricks/service: orders-app
    spec:
      initContainers:
        - name: wait-database
          image: postgres:16.4-alpine
          command:
            - /bin/sh
            - "-c"
            - "deadline=$$(( $$(date +%s) + PB_WAIT_TIMEOUT ))\nuntil \"$$@\" >/dev/null 2>&1; do\n  if [ \"$$(date +%s)\" -ge \"$$deadline\" ]; then\n    echo \"plugbricks: WAIT_TIMEOUT: gave up waiting for $$PB_WAIT_FOR after $${PB_WAIT_TIMEOUT}s\" >&2\n    exit 124\n  fi\n  sleep \"$$PB_WAIT_INTERVAL\"\ndone\necho \"plugbricks: $$PB_WAIT_FOR is ready\""
            - plugbricks-wait
          args:
            - pg_isready
            - "-q"
            - "-h"
            - postgres-db
            - "-p"
            - "5432"
            - "-t"
            - "2"
          env:
            - name: PB_WAIT_FOR
              value: "database from postgres-db (for orders)"
            - name: PB_WAIT_INTERVAL
              value: "2"
            - name: PB_WAIT_TIMEOUT
              value: "120"
        - name: provision-database
          image: postgres:16.4-alpine
          command:
            - /bin/sh
            - /provision/create-database.sh
          env:
            - name: PB_POSTGRES__ORDERS__CONSUMER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_POSTGRES__ORDERS__CONSUMER_PASSWORD
            - name: PB_POSTGRES__SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_POSTGRES__SUPERUSER_PASSWORD
            - name: APP_DATABASE
              value: orders
            - name: APP_PASSWORD
              value: "$(PB_POSTGRES__ORDERS__CONSUMER_PASSWORD)"
            - name: APP_ROLE
              value: orders
            - name: PGHOST
              value: postgres-db
            - name: PGPASSWORD
              value: "$(PB_POSTGRES__SUPERUSER_PASSWORD)"
            - name: PGPORT
              value: "5432"
          volumeMounts:
            - name: scripts-database
              mountPath: /provision
              readOnly: true
      containers:
        - name: app
          image: ghcr.io/example/orders-app:0.1.0
          ports:
            - containerPort: 4000
          env:
            - name: PB_POSTGRES__ORDERS__CONSUMER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_POSTGRES__ORDERS__CONSUMER_PASSWORD
            - name: DATABASE_URL
              value: "postgres://orders:$(PB_POSTGRES__ORDERS__CONSUMER_PASSWORD)@postgres-db:5432/orders"
          readinessProbe:
            exec:
              command:
                - wget
                - "-qO-"
                - http://localhost:4000/health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
      volumes:
        - name: scripts-database
          configMap:
            name: postgres-database-scripts
            defaultMode: 292
            items:
              - key: create-database.sh
                path: create-database.sh
