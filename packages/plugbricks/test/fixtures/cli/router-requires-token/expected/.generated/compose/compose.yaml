# Generated by plugbricks from platform.lock and .platform/bricks/. Do not edit: run "plugbricks generate".
name: demo
services:
  keycloak-app:
    image: plugbricks-example/keycloak:0.1.0
    environment:
      DATABASE_URL: "postgres://keycloak:${PB_POSTGRES__KEYCLOAK__CONSUMER_PASSWORD:?missing secret; run plugbricks generate}@postgres-db:5432/keycloak"
      GRAPHQL_URL: http://router:3002/graphql
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${PB_KEYCLOAK__ADMIN_PASSWORD:?missing secret; run plugbricks generate}"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HOSTNAME: http://127.0.0.1:8080
      KC_HTTP_ENABLED: "true"
      PUBLIC_GRAPHQL_URL: http://127.0.0.1:4000/graphql
    healthcheck:
      test:
        - CMD
        - bash
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/plugbricks/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: "10s"
      timeout: "5s"
      retries: 10
      start_period: "180s"
    depends_on:
      keycloak-provision-database:
        condition: service_completed_successfully
    ports:
      - target: 8080
        published: "8080"
        host_ip: "127.0.0.1"
        protocol: tcp
    restart: unless-stopped
  keycloak-provision-database:
    image: postgres:16.4-alpine
    entrypoint:
      - /bin/sh
      - /provision/create-database.sh
    environment:
      APP_DATABASE: keycloak
      APP_PASSWORD: "${PB_POSTGRES__KEYCLOAK__CONSUMER_PASSWORD:?missing secret; run plugbricks generate}"
      APP_ROLE: keycloak
      PGHOST: postgres-db
      PGPASSWORD: "${PB_POSTGRES__SUPERUSER_PASSWORD:?missing secret; run plugbricks generate}"
      PGPORT: "5432"
    volumes:
      - type: bind
        source: "../../.platform/bricks/postgres/provision"
        target: /provision
        read_only: true
    depends_on:
      keycloak-wait-database:
        condition: service_completed_successfully
    restart: "no"
  keycloak-wait-database:
    image: postgres:16.4-alpine
    entrypoint:
      - /bin/sh
      - "-c"
      - "deadline=$$(( $$(date +%s) + PB_WAIT_TIMEOUT ))\nuntil \"$$@\" >/dev/null 2>&1; do\n  if [ \"$$(date +%s)\" -ge \"$$deadline\" ]; then\n    echo \"plugbricks: WAIT_TIMEOUT: gave up waiting for $$PB_WAIT_FOR after $${PB_WAIT_TIMEOUT}s\" >&2\n    exit 124\n  fi\n  sleep \"$$PB_WAIT_INTERVAL\"\ndone\necho \"plugbricks: $$PB_WAIT_FOR is ready\""
      - plugbricks-wait
    command:
      - pg_isready
      - "-q"
      - "-h"
      - postgres-db
      - "-p"
      - "5432"
      - "-t"
      - "2"
    environment:
      PB_WAIT_FOR: "database from postgres-db (for keycloak)"
      PB_WAIT_INTERVAL: "2"
      PB_WAIT_TIMEOUT: "120"
    depends_on:
      postgres-db:
        condition: service_started
    restart: "no"
  orders-app:
    image: plugbricks-example/orders:0.1.0
    environment:
      AUTHORIZATION_MUTATIONS_ROLE: orders:write
      AUTHORIZATION_QUERIES_ROLE: orders:read
      DATABASE_URL: "postgres://orders:${PB_POSTGRES__ORDERS__CONSUMER_PASSWORD:?missing secret; run plugbricks generate}@postgres-db:5432/orders"
      OIDC_AUDIENCE: plugbricks-router
      OIDC_CLIENT_ID: orders
      OIDC_CLIENT_SECRET: "${PB_KEYCLOAK__ORDERS__CLIENT_SECRET:?missing secret; run plugbricks generate}"
      OIDC_ISSUER: http://127.0.0.1:8080/realms/plugbricks
      OIDC_JWKS_URL: http://keycloak-app:8080/realms/plugbricks/protocol/openid-connect/certs
      OIDC_TOKEN_URL: http://keycloak-app:8080/realms/plugbricks/protocol/openid-connect/token
    healthcheck:
      test:
        - CMD
        - wget
        - "-qO-"
        - http://localhost:4000/health
      interval: "5s"
      timeout: "3s"
      retries: 10
      start_period: "0s"
    depends_on:
      orders-provision-database:
        condition: service_completed_successfully
      orders-provision-oidc:
        condition: service_completed_successfully
    restart: unless-stopped
  orders-provision-database:
    image: postgres:16.4-alpine
    entrypoint:
      - /bin/sh
      - /provision/create-database.sh
    environment:
      APP_DATABASE: orders
      APP_PASSWORD: "${PB_POSTGRES__ORDERS__CONSUMER_PASSWORD:?missing secret; run plugbricks generate}"
      APP_ROLE: orders
      PGHOST: postgres-db
      PGPASSWORD: "${PB_POSTGRES__SUPERUSER_PASSWORD:?missing secret; run plugbricks generate}"
      PGPORT: "5432"
    volumes:
      - type: bind
        source: "../../.platform/bricks/postgres/provision"
        target: /provision
        read_only: true
    depends_on:
      orders-wait-database:
        condition: service_completed_successfully
    restart: "no"
  orders-provision-oidc:
    image: plugbricks-example/keycloak:0.1.0
    entrypoint:
      - /bin/bash
      - /provision/create-client.sh
    environment:
      ADMIN_PASSWORD: "${PB_KEYCLOAK__ADMIN_PASSWORD:?missing secret; run plugbricks generate}"
      AUDIENCE: plugbricks-router
      CLIENT_ID: orders
      CLIENT_SECRET: "${PB_KEYCLOAK__ORDERS__CLIENT_SECRET:?missing secret; run plugbricks generate}"
      GRANTS: ""
      KEYCLOAK_URL: http://keycloak-app:8080
      REALM: plugbricks
      ROLES: "orders:read orders:write"
    volumes:
      - type: bind
        source: "../../.platform/bricks/keycloak/provision"
        target: /provision
        read_only: true
    depends_on:
      orders-wait-oidc:
        condition: service_completed_successfully
    restart: "no"
  orders-wait-database:
    image: postgres:16.4-alpine
    entrypoint:
      - /bin/sh
      - "-c"
      - "deadline=$$(( $$(date +%s) + PB_WAIT_TIMEOUT ))\nuntil \"$$@\" >/dev/null 2>&1; do\n  if [ \"$$(date +%s)\" -ge \"$$deadline\" ]; then\n    echo \"plugbricks: WAIT_TIMEOUT: gave up waiting for $$PB_WAIT_FOR after $${PB_WAIT_TIMEOUT}s\" >&2\n    exit 124\n  fi\n  sleep \"$$PB_WAIT_INTERVAL\"\ndone\necho \"plugbricks: $$PB_WAIT_FOR is ready\""
      - plugbricks-wait
    command:
      - pg_isready
      - "-q"
      - "-h"
      - postgres-db
      - "-p"
      - "5432"
      - "-t"
      - "2"
    environment:
      PB_WAIT_FOR: "database from postgres-db (for orders)"
      PB_WAIT_INTERVAL: "2"
      PB_WAIT_TIMEOUT: "120"
    depends_on:
      postgres-db:
        condition: service_started
    restart: "no"
  orders-wait-oidc:
    image: plugbricks-example/keycloak:0.1.0
    entrypoint:
      - /bin/sh
      - "-c"
      - "deadline=$$(( $$(date +%s) + PB_WAIT_TIMEOUT ))\nuntil \"$$@\" >/dev/null 2>&1; do\n  if [ \"$$(date +%s)\" -ge \"$$deadline\" ]; then\n    echo \"plugbricks: WAIT_TIMEOUT: gave up waiting for $$PB_WAIT_FOR after $${PB_WAIT_TIMEOUT}s\" >&2\n    exit 124\n  fi\n  sleep \"$$PB_WAIT_INTERVAL\"\ndone\necho \"plugbricks: $$PB_WAIT_FOR is ready\""
      - plugbricks-wait
    command:
      - bash
      - "-c"
      - "exec 3<>/dev/tcp/keycloak-app/8080 && printf 'GET /realms/plugbricks/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
    environment:
      PB_WAIT_FOR: "oidc from keycloak-app (for orders)"
      PB_WAIT_INTERVAL: "2"
      PB_WAIT_TIMEOUT: "300"
    depends_on:
      keycloak-app:
        condition: service_started
    restart: "no"
  orders-web-app:
    image: plugbricks-example/orders-web:0.1.0
    environment:
      GRAPHQL_URL: http://router:3002/graphql
      OIDC_AUDIENCE: plugbricks-router
      OIDC_CLIENT_ID: orders-web
      OIDC_CLIENT_SECRET: "${PB_KEYCLOAK__ORDERS_WEB__CLIENT_SECRET:?missing secret; run plugbricks generate}"
      OIDC_ISSUER: http://127.0.0.1:8080/realms/plugbricks
      OIDC_JWKS_URL: http://keycloak-app:8080/realms/plugbricks/protocol/openid-connect/certs
      OIDC_TOKEN_URL: http://keycloak-app:8080/realms/plugbricks/protocol/openid-connect/token
      PUBLIC_GRAPHQL_URL: http://127.0.0.1:4000/graphql
      WEB_ORIGIN: http://127.0.0.1:8081
    healthcheck:
      test:
        - CMD
        - wget
        - "-qO-"
        - http://localhost:3000/health
      interval: "5s"
      timeout: "3s"
      retries: 10
      start_period: "0s"
    depends_on:
      orders-web-provision-oidc:
        condition: service_completed_successfully
    ports:
      - target: 3000
        published: "8081"
        host_ip: "127.0.0.1"
        protocol: tcp
    restart: unless-stopped
  orders-web-provision-oidc:
    image: plugbricks-example/keycloak:0.1.0
    entrypoint:
      - /bin/bash
      - /provision/create-client.sh
    environment:
      ADMIN_PASSWORD: "${PB_KEYCLOAK__ADMIN_PASSWORD:?missing secret; run plugbricks generate}"
      AUDIENCE: plugbricks-router
      CLIENT_ID: orders-web
      CLIENT_SECRET: "${PB_KEYCLOAK__ORDERS_WEB__CLIENT_SECRET:?missing secret; run plugbricks generate}"
      GRANTS: orders/orders:read
      KEYCLOAK_URL: http://keycloak-app:8080
      REALM: plugbricks
      ROLES: ""
    volumes:
      - type: bind
        source: "../../.platform/bricks/keycloak/provision"
        target: /provision
        read_only: true
    depends_on:
      orders-web-wait-oidc:
        condition: service_completed_successfully
    restart: "no"
  orders-web-wait-oidc:
    image: plugbricks-example/keycloak:0.1.0
    entrypoint:
      - /bin/sh
      - "-c"
      - "deadline=$$(( $$(date +%s) + PB_WAIT_TIMEOUT ))\nuntil \"$$@\" >/dev/null 2>&1; do\n  if [ \"$$(date +%s)\" -ge \"$$deadline\" ]; then\n    echo \"plugbricks: WAIT_TIMEOUT: gave up waiting for $$PB_WAIT_FOR after $${PB_WAIT_TIMEOUT}s\" >&2\n    exit 124\n  fi\n  sleep \"$$PB_WAIT_INTERVAL\"\ndone\necho \"plugbricks: $$PB_WAIT_FOR is ready\""
      - plugbricks-wait
    command:
      - bash
      - "-c"
      - "exec 3<>/dev/tcp/keycloak-app/8080 && printf 'GET /realms/plugbricks/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
    environment:
      PB_WAIT_FOR: "oidc from keycloak-app (for orders-web)"
      PB_WAIT_INTERVAL: "2"
      PB_WAIT_TIMEOUT: "300"
    depends_on:
      keycloak-app:
        condition: service_started
    restart: "no"
  postgres-db:
    image: postgres:16.4-alpine
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: "${PB_POSTGRES__SUPERUSER_PASSWORD:?missing secret; run plugbricks generate}"
    healthcheck:
      test:
        - CMD
        - pg_isready
        - "-U"
        - postgres
      interval: "5s"
      timeout: "3s"
      retries: 10
      start_period: "0s"
    volumes:
      - type: volume
        source: postgres-db-data
        target: /var/lib/postgresql/data
    restart: unless-stopped
  router:
    image: ghcr.io/wundergraph/cosmo/router:0.372.0@sha256:bfe6d89a89ab70975bc874dc234600fe5a6ba6d9498485465a31be4c5b9d0205
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    environment:
      CONFIG_PATH: /config/router.yaml
      CORS_ALLOW_ORIGINS: "http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:8081,http://localhost:8081"
      COSMO_TELEMETRY_DISABLED: "true"
      DO_NOT_TRACK: "1"
      EXECUTION_CONFIG_FILE_PATH: /config/router-config.json
      LISTEN_ADDR: "0.0.0.0:3002"
      METRICS_OTLP_ENABLED: "false"
      PLAYGROUND_ENABLED: "false"
      PROMETHEUS_ENABLED: "false"
      TRACING_ENABLED: "false"
    labels:
      plugbricks.router-config-sha256: "424bd1ef1fe3fe8ffe56c03ea73fbdac25631cbd70f989da7a9a2f0298a04fa3"
      plugbricks.router-auth-sha256: "47f3346e09b0d3ee12329a86ccd52bada15df44e8b357d14b3931be13bd57039"
    volumes:
      - type: bind
        source: "./router-config.json"
        target: /config/router-config.json
        read_only: true
      - type: bind
        source: "./router.yaml"
        target: /config/router.yaml
        read_only: true
    ports:
      - target: 3002
        published: "4000"
        host_ip: "127.0.0.1"
        protocol: tcp
    depends_on:
      orders-app:
        condition: service_healthy
      keycloak-app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-db-data:
    name: demo_postgres-db-data
