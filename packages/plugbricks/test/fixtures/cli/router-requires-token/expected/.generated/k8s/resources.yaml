apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  namespace: demo
  labels:
    app.kubernetes.io/managed-by: plugbricks
    app.kubernetes.io/part-of: demo
    plugbricks/component: router
spec:
  replicas: 1
  selector:
    matchLabels:
      plugbricks/service: router
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: plugbricks
        app.kubernetes.io/part-of: demo
        plugbricks/component: router
        plugbricks/service: router
      annotations:
        plugbricks/router-config-sha256: "5f008ab31e260fe15b7fc145ac080239a8c46561fc67b978a051f987536020f6"
        plugbricks/router-auth-sha256: "47f3346e09b0d3ee12329a86ccd52bada15df44e8b357d14b3931be13bd57039"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-oidc
          image: plugbricks-example/keycloak:0.1.0
          command:
            - /bin/sh
            - "-c"
            - "deadline=$$(( $$(date +%s) + PB_WAIT_TIMEOUT ))\nuntil \"$$@\" >/dev/null 2>&1; do\n  if [ \"$$(date +%s)\" -ge \"$$deadline\" ]; then\n    echo \"plugbricks: WAIT_TIMEOUT: gave up waiting for $$PB_WAIT_FOR after $${PB_WAIT_TIMEOUT}s\" >&2\n    exit 124\n  fi\n  sleep \"$$PB_WAIT_INTERVAL\"\ndone\necho \"plugbricks: $$PB_WAIT_FOR is ready\""
            - plugbricks-wait
          args:
            - bash
            - "-c"
            - "exec 3<>/dev/tcp/keycloak-app/8080 && printf 'GET /realms/plugbricks/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
          env:
            - name: PB_WAIT_FOR
              value: "oidc from keycloak-app (for the router)"
            - name: PB_WAIT_INTERVAL
              value: "2"
            - name: PB_WAIT_TIMEOUT
              value: "300"
      containers:
        - name: router
          image: ghcr.io/wundergraph/cosmo/router:0.372.0@sha256:bfe6d89a89ab70975bc874dc234600fe5a6ba6d9498485465a31be4c5b9d0205
          ports:
            - name: graphql
              containerPort: 3002
          env:
            - name: CONFIG_PATH
              value: /config/router.yaml
            - name: CORS_ALLOW_ORIGINS
              value: "http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:8081,http://localhost:8081"
            - name: COSMO_TELEMETRY_DISABLED
              value: "true"
            - name: DO_NOT_TRACK
              value: "1"
            - name: EXECUTION_CONFIG_FILE_PATH
              value: /config/router-config.json
            - name: LISTEN_ADDR
              value: "0.0.0.0:3002"
            - name: METRICS_OTLP_ENABLED
              value: "false"
            - name: PLAYGROUND_ENABLED
              value: "false"
            - name: PROMETHEUS_ENABLED
              value: "false"
            - name: TRACING_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3002
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3002
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: router-config
            defaultMode: 292
