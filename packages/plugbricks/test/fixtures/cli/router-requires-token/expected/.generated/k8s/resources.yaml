metadata:
  name: router-config
  namespace: demo
  labels:
    app.kubernetes.io/managed-by: plugbricks
    app.kubernetes.io/part-of: demo
    plugbricks/component: router
data:
  router-config.json: "{\"engineConfig\":{\"defaultFlushInterval\":\"500\",\"datasourceConfigurations\":[{\"kind\":\"GRAPHQL\",\"rootNodes\":[{\"typeName\":\"Order\",\"fieldNames\":[\"id\",\"total\",\"status\",\"createdBy\"]},{\"typeName\":\"Query\",\"fieldNames\":[\"orders\",\"order\"]},{\"typeName\":\"Mutation\",\"fieldNames\":[\"createOrder\"]}],\"overrideFieldPathFromAlias\":true,\"customGraphql\":{\"fetch\":{\"url\":{\"staticVariableContent\":\"http://orders-app:4000/graphql\"},\"method\":\"POST\",\"body\":{},\"baseUrl\":{},\"path\":{}},\"subscription\":{\"enabled\":true,\"url\":{\"staticVariableContent\":\"http://orders-app:4000/graphql\"},\"protocol\":\"GRAPHQL_SUBSCRIPTION_PROTOCOL_WS\",\"websocketSubprotocol\":\"GRAPHQL_WEBSOCKET_SUBPROTOCOL_AUTO\"},\"federation\":{\"enabled\":true,\"serviceSdl\":\"extend schema\\n  @link(url: \\\"https://specs.apollo.dev/federation/v2.5\\\", import: [\\\"@key\\\"])\\n\\ntype Order @key(fields: \\\"id\\\") {\\n  id: ID!\\n  total: Float!\\n  status: String!\\n  \\\"Who created it: the verified token's preferred_username, else its sub. Null when the API checks no token (D20).\\\"\\n  createdBy: String\\n}\\n\\ntype Query {\\n  \\\"Newest first. limit is between 1 and 500.\\\"\\n  orders(limit: Int! = 100): [Order!]!\\n  order(id: ID!): Order\\n}\\n\\ntype Mutation {\\n  \\\"Creates an order with status pending. total must be between 0 and 9999999999.99.\\\"\\n  createOrder(total: Float!): Order!\\n}\\n\"},\"upstreamSchema\":{\"key\":\"8ac0929ca947b5577f4a839fa6aa140617c66fbf\"}},\"requestTimeoutSeconds\":\"10\",\"id\":\"0\",\"keys\":[{\"typeName\":\"Order\",\"selectionSet\":\"id\"}]}],\"fieldConfigurations\":[{\"typeName\":\"Query\",\"fieldName\":\"orders\",\"argumentsConfiguration\":[{\"name\":\"limit\",\"sourceType\":\"FIELD_ARGUMENT\"}]},{\"typeName\":\"Query\",\"fieldName\":\"order\",\"argumentsConfiguration\":[{\"name\":\"id\",\"sourceType\":\"FIELD_ARGUMENT\"}]},{\"typeName\":\"Mutation\",\"fieldName\":\"createOrder\",\"argumentsConfiguration\":[{\"name\":\"total\",\"sourceType\":\"FIELD_ARGUMENT\"}]}],\"graphqlSchema\":\"schema {\\n  query: Query\\n  mutation: Mutation\\n}\\n\\ntype Order {\\n  id: ID!\\n  total: Float!\\n  status: String!\\n  \\\"\\\"\\\"\\n  Who created it: the verified token's preferred_username, else its sub. Null when the API checks no token (D20).\\n  \\\"\\\"\\\"\\n  createdBy: String\\n}\\n\\ntype Query {\\n  \\\"\\\"\\\"Newest first. limit is between 1 and 500.\\\"\\\"\\\"\\n  orders(limit: Int! = 100): [Order!]!\\n  order(id: ID!): Order\\n}\\n\\ntype Mutation {\\n  \\\"\\\"\\\"\\n  Creates an order with status pending. total must be between 0 and 9999999999.99.\\n  \\\"\\\"\\\"\\n  createOrder(total: Float!): Order!\\n}\",\"stringStorage\":{\"8ac0929ca947b5577f4a839fa6aa140617c66fbf\":\"schema {\\n  query: Query\\n  mutation: Mutation\\n}\\n\\ndirective @key(fields: openfed__FieldSet!, resolvable: Boolean = true) repeatable on INTERFACE | OBJECT\\n\\ndirective @link(as: String, for: link__Purpose, import: [link__Import], url: String!) repeatable on SCHEMA\\n\\ntype Mutation {\\n  \\\"\\\"\\\"\\n  Creates an order with status pending. total must be between 0 and 9999999999.99.\\n  \\\"\\\"\\\"\\n  createOrder(total: Float!): Order!\\n}\\n\\ntype Order @key(fields: \\\"id\\\") {\\n  \\\"\\\"\\\"\\n  Who created it: the verified token's preferred_username, else its sub. Null when the API checks no token (D20).\\n  \\\"\\\"\\\"\\n  createdBy: String\\n  id: ID!\\n  status: String!\\n  total: Float!\\n}\\n\\ntype Query {\\n  order(id: ID!): Order\\n  \\\"\\\"\\\"Newest first. limit is between 1 and 500.\\\"\\\"\\\"\\n  orders(limit: Int! = 100): [Order!]!\\n}\\n\\nscalar link__Import\\n\\nenum link__Purpose {\\n  EXECUTION\\n  SECURITY\\n}\\n\\nscalar openfed__FieldSet\"}},\"version\":\"00000000-0000-0000-0000-000000000000\",\"subgraphs\":[{\"id\":\"0\",\"name\":\"orders\",\"routingUrl\":\"http://orders-app:4000/graphql\"}],\"compatibilityVersion\":\"1:0.68.1\"}"
  router.yaml: "version: \"1\"\nauthentication:\n  jwt:\n    jwks:\n      - url: http://keycloak-app:8080/realms/plugbricks/protocol/openid-connect/certs\n        issuers:\n          - http://127.0.0.1:8080/realms/plugbricks\n        audiences:\n          - plugbricks-router\n        algorithms:\n          - RS256\nauthorization:\n  require_authentication: true\nheaders:\n  all:\n    request:\n      - op: propagate\n        named: Authorization\n"
