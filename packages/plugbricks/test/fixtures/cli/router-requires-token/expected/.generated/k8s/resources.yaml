data:
  router-config.json: "{\"engineConfig\":{\"defaultFlushInterval\":\"500\",\"datasourceConfigurations\":[{\"kind\":\"GRAPHQL\",\"rootNodes\":[{\"typeName\":\"Order\",\"fieldNames\":[\"id\",\"total\",\"status\"]},{\"typeName\":\"Query\",\"fieldNames\":[\"orders\",\"order\"]},{\"typeName\":\"Mutation\",\"fieldNames\":[\"createOrder\"]}],\"overrideFieldPathFromAlias\":true,\"customGraphql\":{\"fetch\":{\"url\":{\"staticVariableContent\":\"http://orders-app:4000/graphql\"},\"method\":\"POST\",\"body\":{},\"baseUrl\":{},\"path\":{}},\"subscription\":{\"enabled\":true,\"url\":{\"staticVariableContent\":\"http://orders-app:4000/graphql\"},\"protocol\":\"GRAPHQL_SUBSCRIPTION_PROTOCOL_WS\",\"websocketSubprotocol\":\"GRAPHQL_WEBSOCKET_SUBPROTOCOL_AUTO\"},\"federation\":{\"enabled\":true,\"serviceSdl\":\"extend schema\\n  @link(url: \\\"https://specs.apollo.dev/federation/v2.5\\\", import: [\\\"@key\\\"])\\n\\ntype Order @key(fields: \\\"id\\\") {\\n  id: ID!\\n  total: Float!\\n  status: String!\\n}\\n\\ntype Query {\\n  \\\"Newest first. limit is between 1 and 500.\\\"\\n  orders(limit: Int! = 100): [Order!]!\\n  order(id: ID!): Order\\n}\\n\\ntype Mutation {\\n  \\\"Creates an order with status pending. total must be between 0 and 9999999999.99.\\\"\\n  createOrder(total: Float!): Order!\\n}\\n\"},\"upstreamSchema\":{\"key\":\"c31d6e76730b5314f1ad8f87c16e1fc988045c97\"}},\"requestTimeoutSeconds\":\"10\",\"id\":\"0\",\"keys\":[{\"typeName\":\"Order\",\"selectionSet\":\"id\"}]}],\"fieldConfigurations\":[{\"typeName\":\"Query\",\"fieldName\":\"orders\",\"argumentsConfiguration\":[{\"name\":\"limit\",\"sourceType\":\"FIELD_ARGUMENT\"}]},{\"typeName\":\"Query\",\"fieldName\":\"order\",\"argumentsConfiguration\":[{\"name\":\"id\",\"sourceType\":\"FIELD_ARGUMENT\"}]},{\"typeName\":\"Mutation\",\"fieldName\":\"createOrder\",\"argumentsConfiguration\":[{\"name\":\"total\",\"sourceType\":\"FIELD_ARGUMENT\"}]}],\"graphqlSchema\":\"schema {\\n  query: Query\\n  mutation: Mutation\\n}\\n\\ntype Order {\\n  id: ID!\\n  total: Float!\\n  status: String!\\n}\\n\\ntype Query {\\n  \\\"\\\"\\\"Newest first. limit is between 1 and 500.\\\"\\\"\\\"\\n  orders(limit: Int! = 100): [Order!]!\\n  order(id: ID!): Order\\n}\\n\\ntype Mutation {\\n  \\\"\\\"\\\"\\n  Creates an order with status pending. total must be between 0 and 9999999999.99.\\n  \\\"\\\"\\\"\\n  createOrder(total: Float!): Order!\\n}\",\"stringStorage\":{\"c31d6e76730b5314f1ad8f87c16e1fc988045c97\":\"schema {\\n  query: Query\\n  mutation: Mutation\\n}\\n\\ndirective @key(fields: openfed__FieldSet!, resolvable: Boolean = true) repeatable on INTERFACE | OBJECT\\n\\ndirective @link(as: String, for: link__Purpose, import: [link__Import], url: String!) repeatable on SCHEMA\\n\\ntype Mutation {\\n  \\\"\\\"\\\"\\n  Creates an order with status pending. total must be between 0 and 9999999999.99.\\n  \\\"\\\"\\\"\\n  createOrder(total: Float!): Order!\\n}\\n\\ntype Order @key(fields: \\\"id\\\") {\\n  id: ID!\\n  status: String!\\n  total: Float!\\n}\\n\\ntype Query {\\n  order(id: ID!): Order\\n  \\\"\\\"\\\"Newest first. limit is between 1 and 500.\\\"\\\"\\\"\\n  orders(limit: Int! = 100): [Order!]!\\n}\\n\\nscalar link__Import\\n\\nenum link__Purpose {\\n  EXECUTION\\n  SECURITY\\n}\\n\\nscalar openfed__FieldSet\"}},\"version\":\"00000000-0000-0000-0000-000000000000\",\"subgraphs\":[{\"id\":\"0\",\"name\":\"orders\",\"routingUrl\":\"http://orders-app:4000/graphql\"}],\"compatibilityVersion\":\"1:0.68.1\"}"
  router.yaml: "version: \"1\"\nauthentication:\n  jwt:\n    jwks:\n      - url: http://keycloak-app:8080/realms/plugbricks/protocol/openid-connect/certs\n        issuers:\n          - http://127.0.0.1:8080/realms/plugbricks\n        audiences:\n          - plugbricks-router\n        algorithms:\n          - RS256\nauthorization:\n  require_authentication: true\n"
---
apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: demo
  labels:
    app.kubernetes.io/managed-by: plugbricks
    app.kubernetes.io/part-of: demo
    plugbricks/component: router
spec:
  type: ClusterIP
  selector:
    plugbricks/service: router
  ports:
    - name: graphql
      port: 4000
      targetPort: 3002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  namespace: demo
  labels:
    app.kubernetes.io/managed-by: plugbricks
    app.kubernetes.io/part-of: demo
    plugbricks/component: router
spec:
  replicas: 1
  selector:
    matchLabels:
      plugbricks/service: router
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: plugbricks
        app.kubernetes.io/part-of: demo
        plugbricks/component: router
        plugbricks/service: router
      annotations:
        plugbricks/router-config-sha256: a9e016339b29163741017a3f25f92e2bc5793a1b3f0d6618b2631d2e5a77c5ae
        plugbricks/router-auth-sha256: f24570583e5c7c4d2aa980109901d8a73dbec8c9875febf510b912c14351fc71
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-oidc
          image: plugbricks-example/keycloak:0.1.0
          command:
            - /bin/sh
            - "-c"
            - "deadline=$$(( $$(date +%s) + PB_WAIT_TIMEOUT ))\nuntil \"$$@\" >/dev/null 2>&1; do\n  if [ \"$$(date +%s)\" -ge \"$$deadline\" ]; then\n    echo \"plugbricks: WAIT_TIMEOUT: gave up waiting for $$PB_WAIT_FOR after $${PB_WAIT_TIMEOUT}s\" >&2\n    exit 124\n  fi\n  sleep \"$$PB_WAIT_INTERVAL\"\ndone\necho \"plugbricks: $$PB_WAIT_FOR is ready\""
            - plugbricks-wait
          args:
            - bash
            - "-c"
            - "exec 3<>/dev/tcp/keycloak-app/8080 && printf 'GET /realms/plugbricks/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
          env:
            - name: PB_WAIT_FOR
              value: "oidc from keycloak-app (for the router)"
            - name: PB_WAIT_INTERVAL
              value: "2"
            - name: PB_WAIT_TIMEOUT
              value: "300"
      containers:
        - name: router
          image: ghcr.io/wundergraph/cosmo/router:0.372.0@sha256:bfe6d89a89ab70975bc874dc234600fe5a6ba6d9498485465a31be4c5b9d0205
          ports:
            - name: graphql
              containerPort: 3002
          env:
            - name: CONFIG_PATH
              value: /config/router.yaml
            - name: CORS_ALLOW_ORIGINS
              value: "http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:8081,http://localhost:8081"
            - name: COSMO_TELEMETRY_DISABLED
              value: "true"
            - name: DO_NOT_TRACK
              value: "1"
            - name: EXECUTION_CONFIG_FILE_PATH
              value: /config/router-config.json
            - name: LISTEN_ADDR
              value: "0.0.0.0:3002"
            - name: METRICS_OTLP_ENABLED
              value: "false"
            - name: PLAYGROUND_ENABLED
              value: "false"
            - name: PROMETHEUS_ENABLED
              value: "false"
            - name: TRACING_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3002
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3002
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: router-config
            defaultMode: 292
