        plugbricks/service: orders-web-app
    spec:
      initContainers:
        - name: wait-oidc
          image: plugbricks-example/keycloak:0.1.0
          command:
            - /bin/sh
            - "-c"
            - "deadline=$$(( $$(date +%s) + PB_WAIT_TIMEOUT ))\nuntil \"$$@\" >/dev/null 2>&1; do\n  if [ \"$$(date +%s)\" -ge \"$$deadline\" ]; then\n    echo \"plugbricks: WAIT_TIMEOUT: gave up waiting for $$PB_WAIT_FOR after $${PB_WAIT_TIMEOUT}s\" >&2\n    exit 124\n  fi\n  sleep \"$$PB_WAIT_INTERVAL\"\ndone\necho \"plugbricks: $$PB_WAIT_FOR is ready\""
            - plugbricks-wait
          args:
            - bash
            - "-c"
            - "exec 3<>/dev/tcp/keycloak-app/8080 && printf 'GET /realms/plugbricks/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
          env:
            - name: PB_WAIT_FOR
              value: "oidc from keycloak-app (for orders-web)"
            - name: PB_WAIT_INTERVAL
              value: "2"
            - name: PB_WAIT_TIMEOUT
              value: "300"
        - name: provision-oidc
          image: plugbricks-example/keycloak:0.1.0
          command:
            - /bin/bash
            - /provision/create-client.sh
          env:
            - name: PB_KEYCLOAK__ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_KEYCLOAK__ADMIN_PASSWORD
            - name: PB_KEYCLOAK__ORDERS_WEB__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_KEYCLOAK__ORDERS_WEB__CLIENT_SECRET
            - name: ADMIN_PASSWORD
              value: "$(PB_KEYCLOAK__ADMIN_PASSWORD)"
            - name: AUDIENCE
              value: plugbricks-router
            - name: CLIENT_ID
              value: orders-web
            - name: CLIENT_SECRET
              value: "$(PB_KEYCLOAK__ORDERS_WEB__CLIENT_SECRET)"
            - name: GRANTS
              value: orders/orders:read
            - name: KEYCLOAK_URL
              value: http://keycloak-app:8080
            - name: REALM
              value: plugbricks
            - name: ROLES
              value: ""
          volumeMounts:
            - name: scripts-oidc
              mountPath: /provision
              readOnly: true
      containers:
        - name: app
          image: plugbricks-example/orders-web:0.1.0
          ports:
            - containerPort: 3000
          env:
            - name: PB_KEYCLOAK__ORDERS_WEB__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_KEYCLOAK__ORDERS_WEB__CLIENT_SECRET
            - name: GRAPHQL_URL
              value: http://router:4000/graphql
            - name: OIDC_AUDIENCE
              value: plugbricks-router
            - name: OIDC_CLIENT_ID
              value: orders-web
            - name: OIDC_CLIENT_SECRET
              value: "$(PB_KEYCLOAK__ORDERS_WEB__CLIENT_SECRET)"
            - name: OIDC_ISSUER
              value: http://127.0.0.1:8080/realms/plugbricks
            - name: OIDC_JWKS_URL
              value: http://keycloak-app:8080/realms/plugbricks/protocol/openid-connect/certs
            - name: OIDC_TOKEN_URL
              value: http://keycloak-app:8080/realms/plugbricks/protocol/openid-connect/token
            - name: PUBLIC_GRAPHQL_URL
              value: http://127.0.0.1:4000/graphql
            - name: WEB_ORIGIN
              value: http://127.0.0.1:8081
          readinessProbe:
            exec:
              command:
                - wget
                - "-qO-"
                - http://localhost:3000/health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
      volumes:
        - name: scripts-oidc
          configMap:
            name: keycloak-oidc-scripts
            defaultMode: 365
            items:
              - key: create-client.sh
                path: create-client.sh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
  namespace: demo
  labels:
    app.kubernetes.io/managed-by: plugbricks
    app.kubernetes.io/part-of: demo
    plugbricks/brick: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      plugbricks/service: postgres-db
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: plugbricks
        app.kubernetes.io/part-of: demo
        plugbricks/brick: postgres
        plugbricks/service: postgres-db
    spec:
      containers:
        - name: db
          image: postgres:16.4-alpine
          ports:
            - containerPort: 5432
          env:
            - name: PB_POSTGRES__SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_POSTGRES__SUPERUSER_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              value: "$(PB_POSTGRES__SUPERUSER_PASSWORD)"
          readinessProbe:
            exec:
              command:
                - pg_isready
                - "-U"
                - postgres
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          volumeMounts:
            - name: postgres-db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-db-data
          persistentVolumeClaim:
            claimName: postgres-db-data
---
apiVersion: v1
