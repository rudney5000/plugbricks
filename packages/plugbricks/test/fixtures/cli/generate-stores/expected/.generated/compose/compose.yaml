# Generated by plugbricks from platform.lock and .platform/bricks/. Do not edit: run "plugbricks generate".
name: stores-demo
services:
  consumer-app:
    image: busybox:1.36
    command:
      - sh
      - "-c"
      - "echo \"$$S3_BUCKET\" && sleep infinity"
    environment:
      AWS_ACCESS_KEY_ID: "${PB_SEAWEEDFS__CONSUMER__CONSUMER_ACCESS_KEY:?missing secret; run plugbricks generate}"
      AWS_ENDPOINT_URL_S3: http://seaweedfs-s3:8333
      AWS_REGION: us-east-1
      AWS_SECRET_ACCESS_KEY: "${PB_SEAWEEDFS__CONSUMER__CONSUMER_SECRET_KEY:?missing secret; run plugbricks generate}"
      REDIS_PREFIX: "consumer:"
      REDIS_URL: "redis://consumer:${PB_REDIS__CONSUMER__CONSUMER_PASSWORD:?missing secret; run plugbricks generate}@redis-server:6379"
      S3_BUCKET: consumer
    depends_on:
      consumer-provision-cache:
        condition: service_completed_successfully
      consumer-provision-object-storage:
        condition: service_completed_successfully
    restart: unless-stopped
  consumer-provision-cache:
    image: redis:8.8.4-alpine
    entrypoint:
      - /bin/sh
      - /provision/create-user.sh
    environment:
      APP_PASSWORD: "${PB_REDIS__CONSUMER__CONSUMER_PASSWORD:?missing secret; run plugbricks generate}"
      APP_USER: consumer
      REDIS_ADMIN_PASSWORD: "${PB_REDIS__ADMIN_PASSWORD:?missing secret; run plugbricks generate}"
      REDIS_HOST: redis-server
      REDIS_PORT: "6379"
    volumes:
      - type: bind
        source: "../../.platform/bricks/redis/provision"
        target: /provision
        read_only: true
    depends_on:
      consumer-wait-cache:
        condition: service_completed_successfully
    restart: "no"
  consumer-provision-object-storage:
    image: chrislusf/seaweedfs:4.55
    entrypoint:
      - /bin/sh
      - /provision/create-bucket.sh
    environment:
      ADMIN_ACCESS_KEY: "${PB_SEAWEEDFS__ADMIN_ACCESS_KEY:?missing secret; run plugbricks generate}"
      ADMIN_SECRET_KEY: "${PB_SEAWEEDFS__ADMIN_SECRET_KEY:?missing secret; run plugbricks generate}"
      APP_ACCESS_KEY: "${PB_SEAWEEDFS__CONSUMER__CONSUMER_ACCESS_KEY:?missing secret; run plugbricks generate}"
      APP_NAME: consumer
      APP_SECRET_KEY: "${PB_SEAWEEDFS__CONSUMER__CONSUMER_SECRET_KEY:?missing secret; run plugbricks generate}"
      S3_ENDPOINT: http://seaweedfs-s3:8333
    volumes:
      - type: bind
        source: "../../.platform/bricks/seaweedfs/provision"
        target: /provision
        read_only: true
    depends_on:
      consumer-wait-object-storage:
        condition: service_completed_successfully
    restart: "no"
  consumer-wait-cache:
    image: redis:8.8.4-alpine
    entrypoint:
      - /bin/sh
      - "-c"
      - "deadline=$$(( $$(date +%s) + PB_WAIT_TIMEOUT ))\nuntil \"$$@\" >/dev/null 2>&1; do\n  if [ \"$$(date +%s)\" -ge \"$$deadline\" ]; then\n    echo \"plugbricks: WAIT_TIMEOUT: gave up waiting for $$PB_WAIT_FOR after $${PB_WAIT_TIMEOUT}s\" >&2\n    exit 124\n  fi\n  sleep \"$$PB_WAIT_INTERVAL\"\ndone\necho \"plugbricks: $$PB_WAIT_FOR is ready\""
      - plugbricks-wait
    command:
      - nc
      - "-z"
      - "-w"
      - "2"
      - redis-server
      - "6379"
    environment:
      PB_WAIT_FOR: "cache from redis-server (for consumer)"
      PB_WAIT_INTERVAL: "2"
      PB_WAIT_TIMEOUT: "120"
    depends_on:
      redis-server:
        condition: service_started
    restart: "no"
  consumer-wait-object-storage:
    image: chrislusf/seaweedfs:4.55
    entrypoint:
      - /bin/sh
      - "-c"
      - "deadline=$$(( $$(date +%s) + PB_WAIT_TIMEOUT ))\nuntil \"$$@\" >/dev/null 2>&1; do\n  if [ \"$$(date +%s)\" -ge \"$$deadline\" ]; then\n    echo \"plugbricks: WAIT_TIMEOUT: gave up waiting for $$PB_WAIT_FOR after $${PB_WAIT_TIMEOUT}s\" >&2\n    exit 124\n  fi\n  sleep \"$$PB_WAIT_INTERVAL\"\ndone\necho \"plugbricks: $$PB_WAIT_FOR is ready\""
      - plugbricks-wait
    command:
      - curl
      - "-fsS"
      - "-m"
      - "2"
      - "-o"
      - /dev/null
      - http://seaweedfs-s3:8333/healthz
    environment:
      PB_WAIT_FOR: "object-storage from seaweedfs-s3 (for consumer)"
      PB_WAIT_INTERVAL: "2"
      PB_WAIT_TIMEOUT: "120"
    depends_on:
      seaweedfs-s3:
        condition: service_started
    restart: "no"
  redis-server:
    image: redis:8.8.4-alpine
    command:
      - sh
      - "-c"
      - "set -eu; umask 077; acl=/data/users.acl; touch \"$$acl\"; hash=$$(printf %s \"$$REDIS_PASSWORD\" | sha256sum | cut -c1-64); { echo \"user default on sanitize-payload #$$hash ~* &* +@all\"; grep -v \"^user default \" \"$$acl\" || true; } > \"$$acl.new\"; mv \"$$acl.new\" \"$$acl\"; chown -R redis:redis /data; exec docker-entrypoint.sh redis-server --dir /data --aclfile \"$$acl\""
    environment:
      REDIS_PASSWORD: "${PB_REDIS__ADMIN_PASSWORD:?missing secret; run plugbricks generate}"
    healthcheck:
      test:
        - CMD
        - sh
        - "-c"
        - "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"
      interval: "5s"
      timeout: "3s"
      retries: 10
      start_period: "0s"
    volumes:
      - type: volume
        source: redis-server-data
        target: /data
    restart: unless-stopped
  seaweedfs-s3:
    image: chrislusf/seaweedfs:4.55
    command:
      - server
      - "-filer"
      - "-s3"
      - "-ip=127.0.0.1"
      - "-ip.bind=127.0.0.1"
      - "-s3.ip.bind=0.0.0.0"
      - "-s3.iam.readOnly=false"
      - "-s3.iam.selfServiceRequiresGrant=true"
      - "-s3.port.iceberg=0"
      - "-s3.port.lance=0"
      - "-master.telemetry=false"
    environment:
      AWS_ACCESS_KEY_ID: "${PB_SEAWEEDFS__ADMIN_ACCESS_KEY:?missing secret; run plugbricks generate}"
      AWS_SECRET_ACCESS_KEY: "${PB_SEAWEEDFS__ADMIN_SECRET_KEY:?missing secret; run plugbricks generate}"
    healthcheck:
      test:
        - CMD
        - curl
        - "-fsS"
        - "-o"
        - /dev/null
        - http://127.0.0.1:8333/healthz
      interval: "5s"
      timeout: "3s"
      retries: 10
      start_period: "10s"
    volumes:
      - type: volume
        source: seaweedfs-s3-data
        target: /data
    restart: unless-stopped
volumes:
  redis-server-data:
    name: stores-demo_redis-server-data
  seaweedfs-s3-data:
    name: stores-demo_seaweedfs-s3-data
