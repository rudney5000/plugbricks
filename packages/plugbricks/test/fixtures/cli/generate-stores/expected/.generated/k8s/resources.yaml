apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-server
  namespace: stores-demo
  labels:
    app.kubernetes.io/managed-by: plugbricks
    app.kubernetes.io/part-of: stores-demo
    plugbricks/brick: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      plugbricks/service: redis-server
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: plugbricks
        app.kubernetes.io/part-of: stores-demo
        plugbricks/brick: redis
        plugbricks/service: redis-server
    spec:
      containers:
        - name: server
          image: redis:8.8.4-alpine
          args:
            - sh
            - "-c"
            - "set -eu; umask 077; acl=/data/users.acl; touch \"$$acl\"; hash=$$(printf %s \"$$REDIS_PASSWORD\" | sha256sum | cut -c1-64); { echo \"user default on sanitize-payload #$$hash ~* &* +@all\"; grep -v \"^user default \" \"$$acl\" || true; } > \"$$acl.new\"; mv \"$$acl.new\" \"$$acl\"; chown -R redis:redis /data; exec docker-entrypoint.sh redis-server --dir /data --aclfile \"$$acl\""
          ports:
            - containerPort: 6379
          env:
            - name: PB_REDIS__ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_REDIS__ADMIN_PASSWORD
            - name: REDIS_PASSWORD
              value: "$(PB_REDIS__ADMIN_PASSWORD)"
          readinessProbe:
            exec:
              command:
                - sh
                - "-c"
                - "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          volumeMounts:
            - name: redis-server-data
              mountPath: /data
      volumes:
        - name: redis-server-data
          persistentVolumeClaim:
            claimName: redis-server-data
---
apiVersion: apps/v1
