            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          startupProbe:
            exec:
              command:
                - curl
                - "-fsS"
                - "-o"
                - /dev/null
                - http://127.0.0.1:8333/healthz
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          volumeMounts:
            - name: seaweedfs-s3-data
              mountPath: /data
      volumes:
        - name: seaweedfs-s3-data
          persistentVolumeClaim:
            claimName: seaweedfs-s3-data
