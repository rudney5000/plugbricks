apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-app
  namespace: stores-demo
  labels:
    app.kubernetes.io/managed-by: plugbricks
    app.kubernetes.io/part-of: stores-demo
    plugbricks/brick: consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      plugbricks/service: consumer-app
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: plugbricks
        app.kubernetes.io/part-of: stores-demo
        plugbricks/brick: consumer
        plugbricks/service: consumer-app
    spec:
      initContainers:
        - name: wait-cache
          image: redis:8.8.4-alpine
          command:
            - /bin/sh
            - "-c"
            - "deadline=$$(( $$(date +%s) + PB_WAIT_TIMEOUT ))\nuntil \"$$@\" >/dev/null 2>&1; do\n  if [ \"$$(date +%s)\" -ge \"$$deadline\" ]; then\n    echo \"plugbricks: WAIT_TIMEOUT: gave up waiting for $$PB_WAIT_FOR after $${PB_WAIT_TIMEOUT}s\" >&2\n    exit 124\n  fi\n  sleep \"$$PB_WAIT_INTERVAL\"\ndone\necho \"plugbricks: $$PB_WAIT_FOR is ready\""
            - plugbricks-wait
          args:
            - nc
            - "-z"
            - "-w"
            - "2"
            - redis-server
            - "6379"
          env:
            - name: PB_WAIT_FOR
              value: "cache from redis-server (for consumer)"
            - name: PB_WAIT_INTERVAL
              value: "2"
            - name: PB_WAIT_TIMEOUT
              value: "120"
        - name: provision-cache
          image: redis:8.8.4-alpine
          command:
            - /bin/sh
            - /provision/create-user.sh
          env:
            - name: PB_REDIS__ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_REDIS__ADMIN_PASSWORD
            - name: PB_REDIS__CONSUMER__CONSUMER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_REDIS__CONSUMER__CONSUMER_PASSWORD
            - name: APP_PASSWORD
              value: "$(PB_REDIS__CONSUMER__CONSUMER_PASSWORD)"
            - name: APP_USER
              value: consumer
            - name: REDIS_ADMIN_PASSWORD
              value: "$(PB_REDIS__ADMIN_PASSWORD)"
            - name: REDIS_HOST
              value: redis-server
            - name: REDIS_PORT
              value: "6379"
          volumeMounts:
            - name: scripts-cache
              mountPath: /provision
              readOnly: true
        - name: wait-object-storage
          image: chrislusf/seaweedfs:4.55
          command:
            - /bin/sh
            - "-c"
            - "deadline=$$(( $$(date +%s) + PB_WAIT_TIMEOUT ))\nuntil \"$$@\" >/dev/null 2>&1; do\n  if [ \"$$(date +%s)\" -ge \"$$deadline\" ]; then\n    echo \"plugbricks: WAIT_TIMEOUT: gave up waiting for $$PB_WAIT_FOR after $${PB_WAIT_TIMEOUT}s\" >&2\n    exit 124\n  fi\n  sleep \"$$PB_WAIT_INTERVAL\"\ndone\necho \"plugbricks: $$PB_WAIT_FOR is ready\""
            - plugbricks-wait
          args:
            - curl
            - "-fsS"
            - "-m"
            - "2"
            - "-o"
            - /dev/null
            - http://seaweedfs-s3:8333/healthz
          env:
            - name: PB_WAIT_FOR
              value: "object-storage from seaweedfs-s3 (for consumer)"
            - name: PB_WAIT_INTERVAL
              value: "2"
            - name: PB_WAIT_TIMEOUT
              value: "120"
        - name: provision-object-storage
          image: chrislusf/seaweedfs:4.55
          command:
            - /bin/sh
            - /provision/create-bucket.sh
          env:
            - name: PB_SEAWEEDFS__ADMIN_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_SEAWEEDFS__ADMIN_ACCESS_KEY
            - name: PB_SEAWEEDFS__ADMIN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_SEAWEEDFS__ADMIN_SECRET_KEY
            - name: PB_SEAWEEDFS__CONSUMER__CONSUMER_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_SEAWEEDFS__CONSUMER__CONSUMER_ACCESS_KEY
            - name: PB_SEAWEEDFS__CONSUMER__CONSUMER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_SEAWEEDFS__CONSUMER__CONSUMER_SECRET_KEY
            - name: ADMIN_ACCESS_KEY
              value: "$(PB_SEAWEEDFS__ADMIN_ACCESS_KEY)"
            - name: ADMIN_SECRET_KEY
              value: "$(PB_SEAWEEDFS__ADMIN_SECRET_KEY)"
            - name: APP_ACCESS_KEY
              value: "$(PB_SEAWEEDFS__CONSUMER__CONSUMER_ACCESS_KEY)"
            - name: APP_NAME
              value: consumer
            - name: APP_SECRET_KEY
              value: "$(PB_SEAWEEDFS__CONSUMER__CONSUMER_SECRET_KEY)"
            - name: S3_ENDPOINT
              value: http://seaweedfs-s3:8333
          volumeMounts:
            - name: scripts-object-storage
              mountPath: /provision
              readOnly: true
      containers:
        - name: app
          image: busybox:1.36
          args:
            - sh
            - "-c"
            - "echo \"$$S3_BUCKET\" && sleep infinity"
          ports:
            - containerPort: 9000
          env:
            - name: PB_REDIS__CONSUMER__CONSUMER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_REDIS__CONSUMER__CONSUMER_PASSWORD
            - name: PB_SEAWEEDFS__CONSUMER__CONSUMER_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_SEAWEEDFS__CONSUMER__CONSUMER_ACCESS_KEY
            - name: PB_SEAWEEDFS__CONSUMER__CONSUMER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_SEAWEEDFS__CONSUMER__CONSUMER_SECRET_KEY
            - name: AWS_ACCESS_KEY_ID
              value: "$(PB_SEAWEEDFS__CONSUMER__CONSUMER_ACCESS_KEY)"
            - name: AWS_ENDPOINT_URL_S3
              value: http://seaweedfs-s3:8333
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_SECRET_ACCESS_KEY
              value: "$(PB_SEAWEEDFS__CONSUMER__CONSUMER_SECRET_KEY)"
            - name: REDIS_PREFIX
              value: "consumer:"
            - name: REDIS_URL
              value: "redis://consumer:$(PB_REDIS__CONSUMER__CONSUMER_PASSWORD)@redis-server:6379"
            - name: S3_BUCKET
              value: consumer
      volumes:
        - name: scripts-cache
          configMap:
            name: redis-cache-scripts
            defaultMode: 365
            items:
              - key: create-user.sh
                path: create-user.sh
        - name: scripts-object-storage
          configMap:
            name: seaweedfs-object-storage-scripts
            defaultMode: 365
            items:
              - key: create-bucket.sh
                path: create-bucket.sh
