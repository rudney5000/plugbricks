            - name: PB_SEAWEEDFS__ADMIN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plugbricks-secrets
                  key: PB_SEAWEEDFS__ADMIN_SECRET_KEY
            - name: AWS_ACCESS_KEY_ID
