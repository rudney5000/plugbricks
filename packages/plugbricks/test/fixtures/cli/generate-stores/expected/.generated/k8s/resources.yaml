        plugbricks/brick: seaweedfs
        plugbricks/service: seaweedfs-s3
    spec:
      containers:
        - name: s3
          image: chrislusf/seaweedfs:4.55
          args:
            - server
            - "-filer"
            - "-s3"
            - "-ip=127.0.0.1"
            - "-ip.bind=127.0.0.1"
            - "-s3.ip.bind=0.0.0.0"
            - "-s3.iam.readOnly=false"
            - "-s3.iam.selfServiceRequiresGrant=true"
            - "-s3.port.iceberg=0"
            - "-s3.port.lance=0"
            - "-master.telemetry=false"
